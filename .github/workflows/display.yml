name: display

on:
  push:
    paths: [display_firmware/**]
  workflow_dispatch:

jobs:
  hmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python display_firmware/tools/lint_program.py
          python display_firmware/tools/lint_frames.py
          python display_firmware/tools/lint_page_ids.py
      - uses: ponywka/hmi-builder@main
        with:
          project-dir: display_firmware
          config: display_firmware/project.json
          output: display_firmware/out/display.HMI
