<!doctype html><html lang="en"><head><meta charset="utf-8"><title>QIDI Q1 Pro screen mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{
  --bg:#181818; --panel:#212021; --card:#292829; --btn:#313039; --btn-hi:#42414a; --btn-press:#292831; --line:#393842;
  --text:#f7f7f7; --text2:#a5a6b5; --text3:#6b6d7b; --accent:#3979ff; --accent-press:#3161ce; --danger:#e7494a; --danger-bg:#4a2429;
  --ok:#31a26b; --warn:#f7a621; --nav:#101010;
  --font:'Noto Sans','Noto Sans CJK SC','Noto Sans CJK JP','Noto Sans CJK KR','Noto Sans Arabic','Noto Sans Hebrew',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#080808;color:#ddd;font-family:system-ui,'Noto Sans',sans-serif}
body{display:flex;min-height:100vh}
#side{position:sticky;top:0;align-self:flex-start;width:260px;height:100vh;overflow:auto;background:#101010;border-right:1px solid #292829;padding:14px;flex:none}
#side h1{font-size:15px;margin:0 0 4px;color:#fff}
#side p{font-size:12px;color:#8c8a94;margin:0 0 12px;line-height:1.4}
#side label{display:block;font-size:12px;color:#9c9aa5;margin:10px 0 4px}
#side select,#side button{width:100%;background:#212021;color:#ddd;border:1px solid #313039;border-radius:6px;padding:6px 8px;font-size:13px}
#side .row{display:flex;gap:6px}
#side .row button{flex:1}
#side button.on{background:#294d9c;border-color:#3979ff;color:#fff}
#side nav a{display:block;color:#bdbac6;text-decoration:none;font-size:13px;padding:3px 0}
#side nav a:hover{color:#fff}
#side nav b{display:block;margin:12px 0 2px;font-size:11px;letter-spacing:.08em;color:#6b6d7b;text-transform:uppercase}
#main{flex:1;padding:24px 28px 80px;min-width:0}
h2{font-size:18px;color:#fff;margin:36px 0 12px;border-bottom:1px solid #292829;padding-bottom:6px}
h2:first-child{margin-top:0}
.grid{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.item{display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;color:#9c9aa5;display:flex;gap:8px;align-items:center}
.cap code{color:#7ba6ff;font-size:11px}
.cap a{color:#7ba6ff;cursor:pointer;font-size:11px;text-decoration:underline}
.scr{position:relative;width:272px;height:480px;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--text);
  font-size:16px;font-weight:500;line-height:1.2;border-radius:6px;box-shadow:0 0 0 1px #292829;transform-origin:0 0}
.zoomwrap{overflow:hidden}
.scr *{position:absolute}
.scr .grid-ov{inset:0;pointer-events:none;z-index:50;display:none;
  background-image:linear-gradient(to right,rgba(255,0,120,.25) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,0,120,.25) 1px,transparent 1px);
  background-size:8px 8px}
.showgrid .scr .grid-ov{display:block}
.scr .guide{z-index:51;pointer-events:none;border:1px dashed rgba(0,200,255,.6);display:none}
.showgrid .scr .guide{display:block}
.show-names .scr [data-w]{outline:1px solid rgba(255,200,0,.5)}
.scr [data-w]:hover{outline:1px solid #ffc700}
/* components */
.card{background:var(--panel);border-radius:14px}
.card.hi{background:var(--card)}
.line{background:var(--line);height:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);border-radius:10px;font-size:16px;font-weight:500;text-align:center;overflow:hidden;white-space:nowrap}
.btn *{position:static}
.btn.sec{background:var(--btn)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--danger-bg);color:#ff8e94}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.press{background:var(--btn-press)}
.btn.primary.press{background:var(--accent-press)}
.btn.dim{background:#292829;color:var(--text3)}
.btn.col{flex-direction:column;gap:2px}
.btn.wrap{white-space:normal;line-height:1.15}
.ico{display:block;flex:none}
.ico svg{width:100%;height:100%;display:block}
.t{display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.t.c{align-items:center;text-align:center}
.t.r{align-items:flex-end;text-align:right}
.t.top{justify-content:flex-start}
.t.bottom{justify-content:flex-end}
/* the six fonts of the screen: text 13 / 16 / 19 and digits 20 / 28 / 32 (one size and weight = one font resource) */
.r-t13{font-size:13px;font-weight:400}
.r-t16{font-size:16px;font-weight:500}
.r-t19{font-size:19px;font-weight:600}
.r-d20{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.r-d28{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.r-d32{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.t.r-t13{color:var(--text2)}
.t.scroll{overflow:hidden;justify-content:flex-start}
.t.nw span{white-space:nowrap}
.hit,.rowhit{background:transparent}
.key.off{background:#292829;color:var(--text3)}
.t.mute{color:var(--text2)}
.t.acc{color:#6b9aff}
.t.red{color:#ff696b}
.t.rtl,.rtl{direction:rtl;unicode-bidi:plaintext}
.scr .t *{position:static}
.nav{left:0;top:424px;width:272px;height:56px;background:var(--nav);border-top:1px solid #212021}
.nav .it{top:0;width:68px;height:55px;display:flex;align-items:center;justify-content:center}
.nav .it .pill{position:static;width:48px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.nav .it.on .pill{background:var(--accent);color:#fff}
.nav .it .pill *{position:static}
.hdr-title{font-size:19px;font-weight:600}
.sw{width:44px;height:26px;border-radius:13px;background:#4a4952}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #8c8a94}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:'';position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bar{background:#292831;border-radius:6px;overflow:hidden}
.bar i{display:block;position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.thumb{background:#313039;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#7b7984}
.tabs{background:#101010;border-radius:12px}
.tabs .tab{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:var(--text2);border-radius:10px}
.tabs .tab.on{background:var(--btn);color:#fff}
.key{display:flex;align-items:center;justify-content:center;background:var(--btn);border-radius:8px;font-size:28px;font-weight:600}
.key.k19{font-size:19px}
.key *{position:static}
.key.fn{background:#292831;color:var(--text2)}
.dim-bg{background:rgba(0,0,0,.7)}
.popup{background:var(--card);border-radius:16px}
.anim{background:#292829;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#6b6d7b;font-size:12px;letter-spacing:.06em}
.step{width:26px;height:26px;border-radius:50%;background:#313039;color:#9c9aa5;font-size:13px;font-weight:400;display:flex;align-items:center;justify-content:center}
.step.on{background:var(--accent);color:#fff}
.step.done{background:var(--ok);color:#fff}
.vline{width:2px;background:#313039}
/* gallery */
.sw-row{display:flex;gap:10px;flex-wrap:wrap}
.sw-c{width:120px;border-radius:8px;overflow:hidden;background:#181818;font-size:11px;color:#aaa}
.sw-c div{height:48px}
.sw-c span{display:block;padding:5px 8px}
.type-sample{background:#181818;border-radius:8px;padding:12px 16px;color:#f7f7f7;font-family:var(--font);margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:none;overflow:auto;padding:30px}
.modal.on{display:block}
.modal .box{max-width:1700px;margin:0 auto}
.modal h3{color:#fff;margin:0 0 14px;display:flex;gap:14px;align-items:center}
.modal h3 button{background:#222;color:#ddd;border:1px solid #444;border-radius:6px;padding:5px 12px}
.langgrid{display:flex;flex-wrap:wrap;gap:16px}
.langgrid .cap{font-size:13px;color:#ccc}
#insp{position:fixed;right:16px;bottom:16px;background:#101010;border:1px solid #313039;border-radius:8px;padding:8px 12px;font-size:12px;color:#ddd;z-index:200;min-width:200px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
.chip{font-size:11px;color:#9c9aa5;border:1px solid #313039;border-radius:10px;padding:1px 8px;cursor:pointer;background:#181818}
.chip.on{background:#294d9c;border-color:#3979ff;color:#fff}
/* the waiting circle turns in 8 steps (a screen animation is a few frames, not a smooth rotation) */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s steps(8) infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* the static layer (?bare=ID&static=1): what the background pictures hold; text, thumbnails, animations and the fill of a bar are widgets */
body.static .t, body.static .btn > span:not(.ico), body.static .thumb > *, body.static .thumb, body.static .anim > *, body.static .bar i, body.static .rowhit .t { visibility:hidden }
body.static .scr .grid-ov, body.static .scr .guide { display:none }
body.static .key, body.static .tabs .tab { color:transparent }
body.static .tabs .tab .ico { color:var(--text2) }
body.static .tabs .tab.on .ico { color:#fff }
body.static .key.fn .ico, body.static .key.off .ico { color:#a5a6b5 !important }

/* the static layer of the decor (?nobtn=1): what lies under the buttons, without the buttons (they are components of their own on the page) */
body.nobtn .btn, body.nobtn .key, body.nobtn .rowhit, body.nobtn .nav .it { visibility:hidden }

/* the static layer is the pixels of the screen: no rounded corners and no frame (they would be baked into the corners of the pictures) */
body.static .scr{border-radius:0;box-shadow:none}

/* the layer of the buttons (?bare=ID&static=1&onlybtn=1): only what belongs to a button, on a transparent background; the anti-aliased edge of the corners is the browser's own,
   so the alpha of the tiles of the screen is the alpha of the HTML (tools/gen_project.py ``screenshot(..., layer=True)``) */
body.onlybtn .scr{background:transparent !important;box-shadow:none}
body.onlybtn .scr *{visibility:hidden !important}
body.onlybtn .scr .btn, body.onlybtn .scr .btn *, body.onlybtn .scr .key, body.onlybtn .scr .key *, body.onlybtn .scr .rowhit, body.onlybtn .scr .rowhit *,
body.onlybtn .scr .nav .it, body.onlybtn .scr .nav .it *, body.onlybtn .scr .lyr, body.onlybtn .scr .lyr *{visibility:visible !important}
body.onlybtn.static .scr .t, body.onlybtn.static .scr .btn > span:not(.ico), body.onlybtn.static .scr .rowhit .t, body.onlybtn.static .scr .lyr .t{visibility:hidden !important}
/* ?hide=a,b: widgets of the screen that are left out of a rendering (they are components of their own on the page; their pieces must not be in the picture of the decor) */
body .hid, body .hid *{visibility:hidden !important}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const tt = (x,y,w,h,key,o,name) => txt(x,y,w,h,T(key),o,name||key);   // a text widget of the page

// ---- fixed slots: a value with its unit ("35 %", "220 / 250 °C") -------------------------------------------------------------
// A text widget draws one font and cannot change its width at run time (x and y can, w and h cannot): "35 %" is two widgets, a number

function heatValue(x,y,w,h,v){

function pctValue(x,y,w,h,val,name,o){

function coordValue(x,y,h,axis,val,name){

    if (n === 0) n = 1;
    if (n < rest.length) {      // break where a name can be broken: after _ - space, before the dot of the extension

// A touch region is a widget of its own (a button with no picture): the decorative parts of a control never are the target.
function hit(x,y,w,h,name){ return `<div class="hit"${nm(name)} title="${tip(name,x,y,w,h)}" style="${st(x,y,w,h)}"></div>`; }
// a slider: a track of 10 px and a knob of 28 px inside a touch region of 44; the knob stays inside the region at both ends
function slider(x,y,w,val,name,o){
  o = o || {};
  const lo = o.min == null ? 0 : o.min, hi = o.max == null ? 100 : o.max, frac = (val-lo)/(hi-lo || 1);
  const th = 44, tr = 10, kn = 28, tx = x+kn/2, tw = w-kn, kx = Math.round(tx+tw*frac), cy = y+th/2;
  let s = hit(x,y,w,th,name);
  s += box(tx,cy-tr/2,tw,tr,'bar','<i style="width:'+Math.round(100*frac)+'%"></i>');
  (o.ticks||[]).forEach(v=>{ s += rect(Math.round(tx+tw*(v-lo)/(hi-lo))-1,cy+tr/2+3,2,6,'#4a4952',1); });
  s += `<div style="${st(kx-kn/2,cy-kn/2,kn,kn)}background:#fff;border-radius:${kn/2}px"></div>`;
  return s;
}

// ---- the animations of the project: the real frames, played in the gallery -------------------------------------------------------
const animSrc = (key,i) => (ANIMS[key].dir || '../animations/') + key + '/' + String(i).padStart(3,'0') + '.png';
function animImg(key,x,y){
  const a = ANIMS[key];
  return `<img data-anim="${key}" data-n="${a.n}" data-ms="${a.ms}" src="${animSrc(key,0)}" alt="" style="${st(x,y,a.w,a.h)}">`;
}
// a block of the page that plays an animation: the frames keep their own size and sit in the middle of the block, so a frame that is
// larger than the block is cropped and a smaller one leaves the background of the block visible
function animBlock(x,y,w,h,key,name){
  const a = ANIMS[key];
  return `<div class="anim"${nm(name)} title="${tip(name,x,y,w,h)}${name?'  frame '+a.w+'×'+a.h:''}" style="${st(x,y,w,h,'overflow:hidden')}">${animImg(key,Math.round((w-a.w)/2),Math.round((h-a.h)/2))}</div>`;
}
// ---- the steps of a wizard (setup guide, filament load / unload, auto leveling) ---------------------------------------------------------
// A list of steps: a circle (done = green with a check, active = blue, the others grey; static pictures, nothing blinks), a line to
// the next one and a text slot per step. items: [{y, h, html, name}] (y = top of the circle, the text is top-aligned from y + 2).
function wizSteps(items, active){
  let s = '';
  items.forEach((p,i)=>{
    const done = i < active, on = i === active;
    s += `<div class="step${done?' done':on?' on':''}" style="${st(14,p.y-1,26,26)}">${done?ico('check',16,'#fff',3):i+1}</div>`;
    if (i < items.length-1) s += `<div class="vline" style="${st(26,p.y+28,2,items[i+1].y-p.y-32)}"></div>`;
    s += txt(50,p.y+2,210,p.h,p.html,{v:'top',mute:!on},p.name);
  });
  return s;
}
// buttons
function btn(x,y,w,h,label,o,name){
  o = o || {};
  const cls = ['btn', o.v||'', o.press?'press':'', o.wrap?'wrap':'', o.col?'col':''].join(' ');
  const inner = (o.icon?(o.left?`<div style="position:absolute;left:16px;top:${(h-(o.is||22))/2}px">${ico(o.icon,o.is||22,o.ic)}</div>`:ico(o.icon,o.is||22,o.ic)):'') + (label?(o.left?`<span${isRtl()?' class="rtl"':''} style="position:absolute;left:48px;right:10px;top:0;height:100%;display:flex;align-items:center;justify-content:${isRtl()?'flex-end':'flex-start'};text-align:${isRtl()?'right':'left'}">${label}</span>`:`<span${isRtl()?' class="rtl"':''} style="padding:0 ${o.wrap?3:6}px">${label}</span>`):'');
  return `<div class="${cls}"${nm(name)} title="${tip(name,x,y,w,h)}" style="${st(x,y,w,h,o.css)}">${inner}</div>`;
}
const tb = (x,y,w,h,key,o,name) => btn(x,y,w,h,T(key),o,name||key);
function row(x,y,w,h,label,o,name){          // a list row: label on the left, something on the right
  o = o || {};
  let right = '';
  if (o.chev) right = `<div style="${st(w-34,(h-22)/2,22,22)}color:var(--text3)">${ico('chevron-right',22)}</div>`;
  if (o.sw!=null) right = `<div class="sw${o.sw?' on':''}" style="left:${w-56}px;top:${(h-26)/2}px"></div>`;
  if (o.check) right = `<div style="${st(w-38,(h-24)/2,24,24)}color:var(--accent)">${ico('check',24,null,2.5)}</div>`;
  if (o.lock) right = `<div style="${st(w-36,(h-20)/2,20,20)}color:var(--text2)">${ico('lock',20)}</div>`;
  if (o.radio!=null) right = `<div class="radio${o.radio?' on':''}" style="left:14px;top:${(h-22)/2}px"></div>`;
  const left = o.radio!=null ? 46 : 16;
  const lw = w-left-(o.radio!=null?12:46);
  // a label that comes from the host (a SSID) is cut to its slot; a text of the project is written to fit
  const lab = o.cut ? txt(left,0,lw,h,nameHTML(label,lw,'t16',1,{ext:false}),{num:1,nowrap:1,dyn:1},null) : txt(left,0,lw,h,label.replace(/<br>/g,' '),{num:o.num},null);
  const bg = `<div style="${st(0,0,w,h)}background:${o.sel?'var(--btn-hi)':'var(--btn)'};border-radius:12px;${o.press?'opacity:.8':''}"></div>`;
  return `<div class="rowhit"${nm(name)} title="${tip(name,x,y,w,h)}" style="${st(x,y,w,h)}">${bg}${lab}${right}</div>`;
}

function progress(x,y,w,h,pct,name){ return box(x,y,w,h,'bar',`<i style="width:${pct}%"></i>`,name); }
// A thumbnail is a picture the host has prepared for the widget: exactly its size, with the corners and the matte of the card already in

function thumb(x,y,w,h,name,glyph){ return box(x,y,w,h,'thumb',ico(glyph||'image',Math.min(w,h)*0.38,null,1.6),name); }

// a segmented control: each cell is a touch region of its own (the tall touch area is the cell, not the inner pill)
function seg(x,y,w,h,labels,active,names){
  const n = labels.length, cw = (w-6)/n, hw = w/n;

    labels.map((l,i)=>`<div class="tab${i===active?' on':''}" style="${st(3+cw*i,3,cw,h-6)}">${l}</div>`).join('') +
    labels.map((l,i)=>hit(hw*i,0,hw,h,names&&names[i])).join('') + '</div>';
}

// A pop-up card: the height is a profile (324 normally, 384 for the long texts); the message gets the room between the icon and the buttons.
// o.h: height of the card; o.scroll: the message scrolls in its own area (an error of any length)
function popup(page, kind, msgs, btns, o){
  o = o || {};
  CUR = page;
  const col = {info:'var(--accent)',warn:'var(--warn)',error:'var(--danger)',ok:'var(--ok)',ask:'var(--accent)'}[kind];
  const g = {info:'info',warn:'triangle-alert',error:'octagon-x',ok:'circle-check',ask:'info'}[kind];
  const h = o.h || 324, y0 = o.h ? Math.round((480-h)/2/8)*8 : 84, by = y0+h-72;
  let s = rect(0,0,272,480,'#101010');
  s += `<div class="popup" style="${st(12,y0,248,h)}"></div>`;
  s += `<div style="${st(112,y0+16,48,48)}border-radius:24px;background:color-mix(in srgb, ${col} 18%, transparent);color:${col};display:flex;align-items:center;justify-content:center">${ico(g,26)}</div>`;
  if (o.scroll) s += scrollBox(28,y0+74,216,h-154,isV('long')?esc(LONG_ERROR):T(msgs[0]),{role:DYNAMIC_ROLE,bar:isV('long'),css:'text-align:center'},msgs[0]);
  else {
    // the message sits in the middle of the room between the icon and the buttons (xcen = 1, ycen = 1 of the stock widget); with two texts the first
    // is bottom-aligned above the middle and the second top-aligned below it (the stock page: ycen 2 and 0)
    const top = y0+68, room = by-6-top;
    if (msgs.length === 1) s += tt(28,top,216,room,msgs[0],{a:'c',role:'t16'},msgs[0]);
    else { const hh = Math.floor((room-8)/2); s += tt(28,top,216,hh,msgs[0],{a:'c',v:'bottom',role:'t16'},msgs[0]) + tt(28,top+hh+8,216,hh,msgs[1],{a:'c',v:'top',sz:'l'},msgs[1]); }
  }
  if (btns.length === 1) s += tb(28,by,216,48,btns[0][0],{v:btns[0][1]||'primary'},btns[0][0]);
  else s += tb(28,by,104,48,btns[0][0],{v:btns[0][1]||'primary',wrap:1},btns[0][0]) + tb(140,by,104,48,btns[1][0],{v:btns[1][1]||'',wrap:1},btns[1][0]);
  return screen(page, s);

const VSTATE = {};       // the chosen variant of every screen (gallery)

// the one way to draw a screen: gallery, all languages, screenshots and the audit all come through here; the globals of the
// builders (language, variant, current page) are put back afterwards
function variantOf(sc){ return sc.variants ? (VSTATE[sc.id] || sc.variants[0].id) : ''; }
function renderScreen(sc, langIndex, variantId){
  const sl = lang, sv = VARIANT, sp = CUR;
  try { if (langIndex != null) lang = langIndex; VARIANT = variantId != null ? variantId : variantOf(sc); return sc.build(); }
  finally { lang = sl; VARIANT = sv; CUR = sp; }
}

function findScreen(id){
  return SCREENS.find(x=>x.id===id) || SCREENS.find(x=>x.id===(GALLERY_ALIASES[id] || PAGE_NAMES[id]));
}

      if(el.closest('.nav') || el.closest('.btn,.key,.tabs,.popup,.card,.rowhit') && el.closest('.btn,.key,.tabs,.popup,.card,.rowhit')!==el) return;
      const r = el.getBoundingClientRect();
      if(r.width<14 || r.height<8) return;
      items.push({n:(el.dataset.w||el.className.split(' ')[0]).replace(/^[^.]*\./,''), x:Math.round(r.left-base.left), y:Math.round(r.top-base.top), w:Math.round(r.width), h:Math.round(r.height)});
    });
    const gaps = {};
    const add = (axis,g,a,b)=>{ (gaps[axis+g] = gaps[axis+g]||[]).push(a.n+'|'+b.n); };
    for(let i=0;i<items.length;i++) for(let j=0;j<items.length;j++){ if(i===j) continue; const a=items[i], b=items[j];
      const oy = Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y), ox = Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);

    }

    out.push({id:sc.id, items:items.length, gaps:Object.fromEntries(Object.entries(gaps).map(([k,v])=>[k,[...new Set(v)].slice(0,4)])), margins:margins.slice(0,6)});

const _range = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); };

  const out = [];

        sc.querySelectorAll('*').forEach(e => { const r = e.getBoundingClientRect(); if (!r.width || !r.height) return;
          const x = r.left - o.left, y = r.top - o.top;
          if (boxes.some(([bx, by, bw, bh]) => x >= bx - 2 && y >= by - 2 && x + r.width <= bx + bw + 2 && y + r.height <= by + bh + 2)) e.classList.add('hid'); }); }
      if (q.has('hide')) { const gone = new Set(q.get('hide').split(',')); m.querySelectorAll('[data-w]').forEach(e => { if (gone.has(e.dataset.w.split('.').pop())) e.classList.add('hid'); }); }
      if (q.has('lyr')) { const names = new Set(q.get('lyr').split(',')); m.querySelectorAll('[data-w]').forEach(e => { if (names.has(e.dataset.w.split('.').pop())) e.classList.add('lyr'); }); } };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(run); else run();
    return;
  }
  if(q.has('only')){      // for screenshots: just these screens (?only=a,b&all=1 for every language, &variant=speed_mute for the variant of the screens that have it)
    side.style.display='none';
    const ids=q.get('only').split(',');
    let h='<div class="grid" style="padding:16px">';
    ids.forEach(id=>{ const sc=findScreen(id); if(!sc) return;
      if (q.has('variant') && sc.variants && sc.variants.some(v=>v.id===q.get('variant'))) VSTATE[sc.id] = q.get('variant');
      if(q.has('all')) h += langGrid(sc);
      else h+=cardHTML(sc,zoom); });
    document.getElementById('main').innerHTML=h+'</div>'; document.getElementById('main').style.padding='0';
    document.body.classList.toggle('showgrid', q.has('grid')); document.body.classList.toggle('show-names', q.has('names'));
    return;
  }
  render();
}

// Firmware export: labels are native text, never pixels inside a button tile.
function firmwareSpec(){
  const host=document.createElement('div'); host.style.cssText='position:absolute;left:0;top:0;width:272px;height:480px'; document.body.appendChild(host);
  const out=[];
  const rgb=c=>{ const m=(c.match(/\d+(\.\d+)?/g)||[]).map(Number); return m[3]===0?null:m.slice(0,3); };
  const kind=el=>['t','btn','hit','rowhit','bar','thumb','anim','key','card','step'].find(c=>el.classList.contains(c))||'box';
  function capture(sc,vid,li){
    host.innerHTML=renderScreen(sc,li,vid);
    const scr=host.querySelector('.scr'), origin=scr.getBoundingClientRect(), order=[...scr.querySelectorAll('*')];
    const geometry=el=>{const r=el.getBoundingClientRect();return {x:Math.round(r.left-origin.left),y:Math.round(r.top-origin.top),w:Math.round(r.width),h:Math.round(r.height)};};
    const matte=el=>{for(let p=el;p&&p!==scr;p=p.parentElement){ const c=rgb(getComputedStyle(p).backgroundColor);if(c)return c; }return [23,23,26];};
    const name=el=>el.dataset.w?el.dataset.w.replace(/^[^.]*\./,''):null;
    const usedHeight=el=>{const r=document.createRange();r.selectNodeContents(el);return Math.ceil(r.getBoundingClientRect().height);};
    const textStyle=el=>{
      const cs=getComputedStyle(el), role=(el.className.match(/\br-(t13|t16|t19|d20|d28|d32)\b/)||[])[1]||({13:'t13',16:'t16',19:'t19',20:'d20',28:'d28',32:'d32'}[Math.round(parseFloat(cs.fontSize))]||'t16');
      return {role,align:el.classList.contains('c')||cs.textAlign==='center'?'c':el.classList.contains('r')||cs.textAlign==='right'?'r':'l', color:rgb(cs.color),matte:matte(el),top:el.classList.contains('top'),bottom:el.classList.contains('bottom'),dyn:el.classList.contains('dyn'),scroll:el.classList.contains('scroll'),used:usedHeight(el)};
    };
    const widgets=[],prims=[],decor=[];
    scr.querySelectorAll('[data-w]').forEach(el=>{
      const cs=getComputedStyle(el), k=kind(el), item={...geometry(el),z:order.indexOf(el),name:name(el),kind:k,bg:rgb(cs.backgroundColor),radius:parseFloat(cs.borderTopLeftRadius)||0,labels:[]};
      if(k==='t')Object.assign(item,textStyle(el),{text:el.innerText});
      if(k==='anim'){const im=el.querySelector('[data-anim]');if(im)item.animation=im.dataset.anim;}
      if(k==='box'&&el.classList.contains('art')){const im=el.querySelector('img');if(im)item.art=im.getAttribute('src');}
      el.querySelectorAll('.t:not([data-w]),:scope > span:not(.ico)').forEach(child=>{
        if(child.closest('svg')||!child.innerText.trim())return;
        const rect=geometry(child);
        // Row slots are already fixed. A plain button label gets a fixed slot independent of its demo string.
        let centered=true;
        if(!child.classList.contains('t')){
          // the label of a button: as wide as the button, at its own height; centred when its middle is the middle of the button
          centered=Math.abs((rect.y+rect.h/2)-(item.y+item.h/2))<=3;
          const withIcon=!!el.querySelector('.ico') && !el.classList.contains('col');
          // a label beside an icon keeps its own place; a lone label is as wide as the button
          if(!withIcon){rect.x=item.x+4;rect.w=item.w-8;}else{rect.x=rect.x-2;rect.w=rect.w+4;}
          rect.h=Math.max(rect.h,18);
          if(centered){rect.h=Math.min(item.h,Math.max(24,rect.h));rect.y=Math.round(item.y+(item.h-rect.h)/2);}
        }
        item.labels.push({...rect,...textStyle(child),text:child.innerText,z:order.indexOf(child),centered});
      });
      if(k==='key'&&!item.labels.length&&el.childNodes[0]&&el.childNodes[0].nodeType===Node.TEXT_NODE&&el.childNodes[0].textContent.trim())
        item.labels.push({...geometry(el),...textStyle(el),align:'c',text:el.childNodes[0].textContent.trim(),z:order.indexOf(el)+0.1});
      if(k==='hit'&&el.parentElement.classList.contains('tabs')){
        const tabs=[...el.parentElement.querySelectorAll(':scope > .tab')],hits=[...el.parentElement.querySelectorAll(':scope > .hit')],tab=tabs[hits.indexOf(el)];
        if(tab&&tab.innerText.trim())item.labels.push({...geometry(el),...textStyle(tab),align:'c',text:tab.innerText,z:order.indexOf(el)+0.1});
      }
      widgets.push(item);
    });
    order.forEach(el=>{
      if(el.closest('.grid-ov,.guide')||el.closest('svg'))return;
      const rect=geometry(el);if(!rect.w||!rect.h)return;
      const cs=getComputedStyle(el),bg=rgb(cs.backgroundColor),owner=el.closest('[data-w]');
      if(el.classList.contains('spin'))prims.push({...rect,z:order.indexOf(el),prim:'fill',name:null,bg:[23,23,26],radius:rect.w/2,cls:'spin',owner:null,matte:matte(el)});
      else if(el.classList.contains('ico'))prims.push({...rect,z:order.indexOf(el),prim:'icon',icon:el.dataset.ico,color:rgb(cs.color),matte:matte(el),owner:owner&&name(owner)});
      else if(bg&&!el.classList.contains('t'))prims.push({...rect,z:order.indexOf(el),prim:'fill',name:name(el),bg,radius:parseFloat(cs.borderTopLeftRadius)||0,cls:el.className,owner:owner&&name(owner)});
      if(el.classList.contains('t')&&!el.dataset.w&&!(owner&&owner!==el))decor.push({...rect,...textStyle(el),text:el.innerText,z:order.indexOf(el),name:'decor_'+order.indexOf(el)});
    });
    return {id:sc.id,page:scr.dataset.page,old:scr.dataset.old,variant:vid,bg:rgb(getComputedStyle(scr).backgroundColor),widgets,prims,decor};
  }
  for(const sc of SCREENS){
    for(const vid of sc.variants?sc.variants.map(v=>v.id):['']){
      const english=capture(sc,vid,2);
      english.languages={};
      for(let li=0;li<13;li++){
        const view=li===2?english:capture(sc,vid,li);
        english.languages[li]={widgets:view.widgets.map(w=>({name:w.name,text:w.text,labels:w.labels,role:w.role,used:w.used})),decor:view.decor};
      }
      out.push(english);
    }
  }
  host.remove(); const pre=document.createElement('pre');pre.id='spec';pre.textContent=JSON.stringify(out);document.body.appendChild(pre);
}

init();
</script></body></html>
