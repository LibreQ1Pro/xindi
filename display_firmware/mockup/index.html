<!doctype html><html lang="en"><head><meta charset="utf-8"><title>QIDI Q1 Pro screen mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{
  --bg:#17171a; --panel:#222226; --card:#2a2a30; --btn:#35353d; --btn-hi:#41414b; --btn-press:#2a2a31; --line:#3a3a43;
  --text:#f4f4f7; --text2:#a6a6b3; --text3:#70707d; --accent:#3d7bff; --accent-press:#2e60cf; --danger:#e5484d; --danger-bg:#4a2326;
  --ok:#30a46c; --warn:#f5a524; --nav:#0f0f11;
  --font:'Noto Sans','Noto Sans CJK SC','Noto Sans CJK JP','Noto Sans CJK KR','Noto Sans Arabic','Noto Sans Hebrew',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0d;color:#ddd;font-family:system-ui,'Noto Sans',sans-serif}
body{display:flex;min-height:100vh}
#side{position:sticky;top:0;align-self:flex-start;width:260px;height:100vh;overflow:auto;background:#121216;border-right:1px solid #26262c;padding:14px;flex:none}
#side h1{font-size:15px;margin:0 0 4px;color:#fff}
#side p{font-size:12px;color:#8a8a96;margin:0 0 12px;line-height:1.4}
#side label{display:block;font-size:12px;color:#9a9aa6;margin:10px 0 4px}
#side select,#side button{width:100%;background:#1c1c22;color:#ddd;border:1px solid #33333c;border-radius:6px;padding:6px 8px;font-size:13px}
#side .row{display:flex;gap:6px}
#side .row button{flex:1}
#side button.on{background:#274a99;border-color:#3d7bff;color:#fff}
#side nav a{display:block;color:#b8b8c4;text-decoration:none;font-size:13px;padding:3px 0}
#side nav a:hover{color:#fff}
#side nav b{display:block;margin:12px 0 2px;font-size:11px;letter-spacing:.08em;color:#6f6f7b;text-transform:uppercase}
#main{flex:1;padding:24px 28px 80px;min-width:0}
h2{font-size:18px;color:#fff;margin:36px 0 12px;border-bottom:1px solid #26262c;padding-bottom:6px}
h2:first-child{margin-top:0}
.grid{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.item{display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;color:#9a9aa6;display:flex;gap:8px;align-items:center}
.cap code{color:#7fa8ff;font-size:11px}
.cap a{color:#7fa8ff;cursor:pointer;font-size:11px;text-decoration:underline}
.scr{position:relative;width:272px;height:480px;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--text);
  font-size:16px;line-height:1.2;border-radius:6px;box-shadow:0 0 0 1px #2a2a30;transform-origin:0 0}
.zoomwrap{overflow:hidden}
.scr *{position:absolute}
.scr .grid-ov{inset:0;pointer-events:none;z-index:50;display:none;
  background-image:linear-gradient(to right,rgba(255,0,120,.25) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,0,120,.25) 1px,transparent 1px);
  background-size:8px 8px}
.showgrid .scr .grid-ov{display:block}
.scr .guide{z-index:51;pointer-events:none;border:1px dashed rgba(0,200,255,.6);display:none}
.showgrid .scr .guide{display:block}
.show-names .scr [data-w]{outline:1px solid rgba(255,200,0,.5)}
.scr [data-w]:hover{outline:1px solid #ffc800}
/* components */
.card{background:var(--panel);border-radius:14px}
.card.hi{background:var(--card)}
.line{background:var(--line);height:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);border-radius:10px;font-size:16px;font-weight:500;text-align:center;overflow:hidden;white-space:nowrap}
.btn *{position:static}
.btn.sec{background:var(--btn)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--danger-bg);color:#ff8d91}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.press{background:var(--btn-press)}
.btn.primary.press{background:var(--accent-press)}
.btn.dim{background:#25252b;color:var(--text3)}
.btn.wrap{white-space:normal;line-height:1.15}
.ico{display:block;flex:none}
.ico svg{width:100%;height:100%;display:block}
.t{display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.t.c{align-items:center;text-align:center}
.t.r{align-items:flex-end;text-align:right}
.t.top{justify-content:flex-start}
.t.bottom{justify-content:flex-end}
.t.s{font-size:13px;color:var(--text2)}
.t.m{font-size:16px}
.t.l{font-size:18px;font-weight:600}
.t.xl{font-size:24px;font-weight:600}
.t.d{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.t.mute{color:var(--text2)}
.t.acc{color:#6f9bff}
.t.red{color:#ff6b6f}
.t.rtl,.rtl{direction:rtl;unicode-bidi:plaintext}
.scr .t *{position:static}
.nav{left:0;top:424px;width:272px;height:56px;background:var(--nav);border-top:1px solid #1f1f24}
.nav .it{top:0;width:68px;height:56px;display:flex;align-items:center;justify-content:center}
.nav .it .pill{position:static;width:48px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.nav .it.on .pill{background:var(--accent);color:#fff}
.nav .it .pill *{position:static}
.hdr-title{font-size:19px;font-weight:600}
.sw{width:44px;height:26px;border-radius:13px;background:#4a4a54}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #8a8a96}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:'';position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bar{background:#2c2c33;border-radius:6px;overflow:hidden}
.bar i{display:block;position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.thumb{background:#2f2f37;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#7d7d89}
.tabs{background:#101012;border-radius:12px}
.tabs .tab{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--text2);border-radius:10px}
.tabs .tab.on{background:var(--btn);color:#fff}
.key{display:flex;align-items:center;justify-content:center;background:var(--btn);border-radius:8px;font-size:22px;font-weight:500}
.key *{position:static}
.key.fn{background:#2b2b32;color:var(--text2)}
.dim-bg{background:rgba(0,0,0,.7)}
.popup{background:var(--card);border-radius:16px}
.anim{background:#26262c;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#6e6e7a;font-size:12px;letter-spacing:.06em}
.step{width:26px;height:26px;border-radius:50%;background:#34343c;color:#9a9aa6;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.step.on{background:var(--accent);color:#fff}
.step.done{background:var(--ok);color:#fff}
.vline{width:2px;background:#34343c}
/* gallery */
.sw-row{display:flex;gap:10px;flex-wrap:wrap}
.sw-c{width:120px;border-radius:8px;overflow:hidden;background:#1a1a1f;font-size:11px;color:#aaa}
.sw-c div{height:48px}
.sw-c span{display:block;padding:5px 8px}
.type-sample{background:#17171a;border-radius:8px;padding:12px 16px;color:#f4f4f7;font-family:var(--font);margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:none;overflow:auto;padding:30px}
.modal.on{display:block}
.modal .box{max-width:1700px;margin:0 auto}
.modal h3{color:#fff;margin:0 0 14px;display:flex;gap:14px;align-items:center}
.modal h3 button{background:#222;color:#ddd;border:1px solid #444;border-radius:6px;padding:5px 12px}
.langgrid{display:flex;flex-wrap:wrap;gap:16px}
.langgrid .cap{font-size:13px;color:#ccc}
#insp{position:fixed;right:16px;bottom:16px;background:#111114;border:1px solid #33333c;border-radius:8px;padding:8px 12px;font-size:12px;color:#ddd;z-index:200;min-width:200px;display:none}
</style></head>

// ---- the pieces of the design: every function returns HTML positioned on the 272 x 480 screen -----------------------
const LANGS = ['zh','ru','en','ja','fr','de','it','es','ko','pt','ar','tr','he'];
const LANG_NAMES = ['中文简体','Русский','English','日本語','Français','Deutsch','Italiano','Español','한국어','Português','العربية','Türkçe','עברית'];
let lang = 2;
let CUR = '';            // the screen that is being built (the key of its texts)

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function anyText(key){ for(const p in TEXTS){ const e=TEXTS[p][key]; if(e && (e[lang]||e[2])) return e; } return null; }
function T(key, page, fb){
  const p = page || CUR;
  let e = (TEXTS[p] || {})[key];
  if(!e || !(e[lang]||e[2])) e = anyText(key) || e;
  let v = e && (e[lang] || e[2]);
  if (v == null || v === '') v = (fb != null ? fb : key);
  return esc(v).replace(/\n/g,'<br>');
}
function raw(key, page){ const e=(TEXTS[page||CUR]||{})[key]; return e && (e[lang]||e[2]) || ''; }
const isRtl = () => lang === 10 || lang === 12;
const ICONS_CACHE = {};
function ico(name, size, color, sw){
  const s = ICONS[name] || ICONS['image'];
  const w = sw || 2;
  return `<span class="ico" style="width:${size}px;height:${size}px;color:${color||'currentColor'}">${s.replace('stroke-width="2"','stroke-width="'+w+'"')}</span>`;
}
const st = (x,y,w,h,extra) => `left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra||''}`;
function nm(name){ return name ? ` data-w="${CUR}.${name}"` : ''; }
function box(x,y,w,h,cls,inner,name,extra){ return `<div class="${cls||''}"${nm(name)} title="${name?CUR+'.'+name+'  '+x+','+y+'  '+w+'×'+h:''}" style="${st(x,y,w,h,extra)}">${inner||''}</div>`; }
function rect(x,y,w,h,color,r,extra){ return `<div style="${st(x,y,w,h)}background:${color};border-radius:${r||0}px;${extra||''}"></div>`; }
// text: o = {c:center, r:right, s/m/l/xl/d: size class, mute, acc, red, top, bottom}
function txt(x,y,w,h,content,o,name){
  o = o || {};
  const cls = ['t', o.a==='c'?'c':'', o.a==='r'?'r':'', o.sz||'m', o.mute?'mute':'', o.acc?'acc':'', o.red?'red':'', o.v==='top'?'top':'', o.v==='bottom'?'bottom':'', isRtl()&&!o.num?'rtl':''].join(' ');
  return `<div class="${cls}"${nm(name)} title="${name?CUR+'.'+name+'  '+x+','+y+'  '+w+'×'+h:''}" style="${st(x,y,w,h,o.css)}"><span>${content}</span></div>`;
}
const tt = (x,y,w,h,key,o,name) => txt(x,y,w,h,T(key),o,name||key);   // a text widget of the page
// buttons
function btn(x,y,w,h,label,o,name){
  o = o || {};
  const cls = ['btn', o.v||'', o.press?'press':'', o.wrap?'wrap':''].join(' ');
  const inner = (o.icon?ico(o.icon,o.is||22,o.ic):'') + (label?`<span${isRtl()?' class="rtl"':''} style="padding:0 6px">${label}</span>`:'');
  return `<div class="${cls}"${nm(name)} title="${name?CUR+'.'+name+'  '+x+','+y+'  '+w+'×'+h:''}" style="${st(x,y,w,h,o.css)}">${inner}</div>`;
}
const tb = (x,y,w,h,key,o,name) => btn(x,y,w,h,T(key),o,name||key);
function row(x,y,w,h,label,o,name){          // a list row: label on the left, something on the right
  o = o || {};

function stepsScreen(page, ys, active, buttons){
  CUR=page;

  const keys=['step1_txt','step2_txt','step3_txt','step4_txt'].filter(k=>(TEXTS[page]||{})[k]);
  keys.forEach((k,i)=>{
    const done=i<active,on=i===active;
    s += `<div class="step${done?' done':on?' on':''}" style="${st(14,ys[i]+2,26,26)}">${done?ico('check',16,'#fff',3):i+1}</div>`;
    if(i<keys.length-1) s += `<div class="vline" style="${st(26,ys[i]+34,2,ys[i+1]-ys[i]-38)}"></div>`;
    s += tt(52,ys[i],208,34,k,{v:'top',mute:!on,css:on?'font-weight:600':''},k);
  });
  return s + buttons;
}

// ---- the page around the screens ------------------------------------------------------------------------------------
const GROUPS = [];
SCREENS.forEach(s=>{ if(!GROUPS.includes(s.group)) GROUPS.push(s.group); });
let zoom = 1, showGrid = false, showNames = false;

function tokensHTML(){
  const sw = (n,v,t)=>`<div class="sw-c"><div style="background:${v}"></div><span><b>${n}</b><br>${v}${t?'<br>'+t:''}</span></div>`;
  return `<h2 id="tokens">Design tokens</h2>
  <p style="color:#9a9aa6;max-width:900px;font-size:13px;line-height:1.5">The screen is 272 × 480, 16-bit colour: flat fills only (no gradients, no shadows: they band). One grid: <b>8 px</b>; page margin <b>12</b>, content width <b>248</b>, gap <b>8</b>; touch targets are at least <b>40</b> high (buttons 44, list rows 46–52); corner radius <b>14</b> for cards, <b>10</b> for buttons, <b>8</b> for keys. The navigation bar is 56 high (y 424), the header 48.</p>
  <div class="sw-row">
  ${sw('bg','#17171a','page')}${sw('panel','#222226','card')}${sw('card','#2a2a30','card, raised')}${sw('btn','#35353d','button')}${sw('btn-hi','#41414b','selected')}${sw('btn-press','#2a2a31','pressed')}
  ${sw('line','#3a3a43','dividers')}${sw('nav','#0f0f11','navigation bar')}${sw('accent','#3d7bff','primary, active')}${sw('accent-press','#2e60cf','primary pressed')}${sw('danger','#e5484d','stop, forget')}${sw('danger-bg','#4a2326','danger button')}${sw('heat','#ff7a59','heater is on')}${sw('ok','#30a46c','done')}${sw('warn','#f5a524','warning')}
  ${sw('text','#f4f4f7','text')}${sw('text2','#a6a6b3','secondary text')}${sw('text3','#70707d','disabled')}
  </div>
  <div class="type-sample"><div style="font-size:24px;font-weight:600">Title 24 / 600 — Nozzle Temp 220</div><div style="font-size:19px;font-weight:600">Header 19 / 600 — Wi-Fi Connection</div>
  <div style="font-size:16px;font-weight:500">Button, body 16 / 500 — Please select the nozzle temperature.</div><div style="font-size:13px;color:#a6a6b3">Caption 13 / 400 — MAX : 350</div>
  <div style="font-size:28px;font-weight:600;font-variant-numeric:tabular-nums">Digits 28 / 600 — 0123456789 °C %</div>
  <div style="font-size:16px;margin-top:6px">中文简体 日本語 한국어 العربية עברית Русский Türkçe</div></div>
  <p style="color:#9a9aa6;max-width:900px;font-size:13px">Fonts needed on the screen (to be rendered as .zi in USART HMI): a text font at 13, 16 (medium) and 19–24 (semibold) pixels that covers Latin, Cyrillic, Greek-less European accents, Chinese, Japanese, Korean, Arabic and Hebrew; and a digit font at 20 / 28 pixels (0-9, "." "-" "/" "%" "°" "℃"). The preview uses Noto Sans.</p>`;
}
function componentsHTML(){
  CUR='';
  const b=(x,y,w,h,l,o)=>btn(x,y,w,h,l,o);
  const comp = (title,html,w,h)=>`<div class="item"><div class="cap">${title}</div><div class="scr" style="width:${w}px;height:${h}px;background:var(--bg)">${html}</div></div>`;
  let h = `<h2 id="components">Components</h2><div class="grid">`;
  h += comp('Buttons: normal / pressed / primary / danger / dim', b(12,12,110,44,'OK')+b(130,12,110,44,'OK',{press:1})+b(12,64,110,44,'Start',{v:'primary'})+b(130,64,110,44,'Start',{v:'primary',press:1})+b(12,116,110,44,'Stop',{v:'danger'})+b(130,116,110,44,'Back',{v:'dim'})+b(12,168,110,44,'',{icon:'chevron-left',is:24})+b(130,168,110,44,'Wi-Fi',{icon:'wifi'}),252,226);
  h += comp('List rows', row(12,12,228,48,'Language',{chev:1})+row(12,68,228,48,'Setup Guide',{sw:true})+row(12,124,228,48,'5 minutes',{radio:true,sel:true})+row(12,180,228,48,'15 minutes',{radio:false})+row(12,236,228,48,'Home Wi-Fi',{check:true})+row(12,292,228,48,'Neighbour',{lock:true}),252,352);
  h += comp('Tabs, toggles, progress', `<div class="tabs" style="${st(12,12,228,40)}"><div class="tab on" style="${st(3,3,111,34)}">General</div><div class="tab" style="${st(114,3,111,34)}">Calibration</div></div>`+toggle(20,70,true)+toggle(80,70,false)+progress(12,116,228,8,35)+`<div class="radio on" style="left:20px;top:150px"></div><div class="radio" style="left:60px;top:150px"></div>`+btn(12,186,228,44,'Auto Bed Leveling',{}),252,250);
  h += comp('Keys', ['1','2','3','4','5','6'].map((k,i)=>`<div class="key" style="${st(12+78*(i%3),12+48*Math.floor(i/3),72,42)}">${k}</div>`).join('')+`<div class="key fn" style="${st(12,108,72,42)}">${ico('delete',20)}</div><div class="key" style="${st(90,108,72,42)}">0</div><div class="key" style="${st(168,108,72,42)};background:var(--accent)">${ico('check',22,'#fff',2.5)}</div>`,252,162);
  return h + '</div>';
}
function cardHTML(s, z){
  lang = lang; const html = s.build();
  return `<div class="item" id="s-${s.id}"><div class="cap"><b style="color:#ddd">${s.title}</b><code>${s.id}</code><a data-all="${s.id}">all languages</a></div>`+
    `<div class="zoomwrap" style="width:${272*z}px;height:${480*z}px"><div style="transform:scale(${z});transform-origin:0 0;width:272px;height:480px;position:relative">${html}</div></div>${s.note?`<div class="cap" style="max-width:${272*z}px;white-space:normal;color:#7d7d89">${s.note}</div>`:''}</div>`;
}
function render(){
  const main = document.getElementById('main');
  let h = tokensHTML() + componentsHTML();
  GROUPS.forEach((g,gi)=>{
    h += `<h2 id="g${gi}">${g}</h2><div class="grid">` + SCREENS.filter(s=>s.group===g).map(s=>cardHTML(s,zoom)).join('') + '</div>';
  });
  main.innerHTML = h;
  document.body.classList.toggle('showgrid', showGrid);
  document.body.classList.toggle('show-names', showNames);
  document.querySelectorAll('[data-all]').forEach(a=>a.onclick=()=>allLanguages(a.dataset.all));
}
function allLanguages(id){
  const s = SCREENS.find(x=>x.id===id); const saved = lang; let h='';
  for(let i=0;i<LANGS.length;i++){ lang=i; h+=`<div class="item"><div class="cap">${LANG_NAMES[i]} <code>${LANGS[i]}</code></div><div class="zoomwrap" style="width:${272*zoom}px;height:${480*zoom}px"><div style="transform:scale(${zoom});transform-origin:0 0;width:272px;height:480px;position:relative">${s.build()}</div></div></div>`; }
  lang = saved;
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="box"><h3>${s.title} — all 13 languages <button id="close">Close</button></h3><div class="langgrid">${h}</div></div>`;
  m.classList.add('on'); document.getElementById('close').onclick=()=>m.classList.remove('on');
}
function init(){
  const side = document.getElementById('side');
  const opts = LANG_NAMES.map((n,i)=>`<option value="${i}"${i===2?' selected':''}>${n} (${LANGS[i]})</option>`).join('');
  side.innerHTML = `<h1>QIDI Q1 Pro screen — mockup</h1><p>272 × 480. Texts are the real ones of the project, in all 13 languages.</p>
   <label>Language</label><select id="lang">${opts}</select>
   <label>Size</label><div class="row"><button data-z="1" class="on">1×</button><button data-z="1.5">1.5×</button><button data-z="2">2×</button></div>
   <label>Overlays</label><div class="row"><button id="grid">8 px grid</button><button id="names">Widget names</button></div>
   <nav><b>Overview</b><a href="#tokens">Design tokens</a><a href="#components">Components</a>${GROUPS.map((g,i)=>`<b>${g}</b>`+SCREENS.filter(s=>s.group===g).map(s=>`<a href="#s-${s.id}">${s.title}</a>`).join('')).join('')}</nav>`;
  document.getElementById('lang').onchange = e=>{ lang=+e.target.value; render(); };
  side.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ zoom=+b.dataset.z; side.querySelectorAll('[data-z]').forEach(x=>x.classList.toggle('on',x===b)); render(); });
  document.getElementById('grid').onclick=e=>{ showGrid=!showGrid; e.target.classList.toggle('on',showGrid); render(); };
  document.getElementById('names').onclick=e=>{ showNames=!showNames; e.target.classList.toggle('on',showNames); render(); };
  const q = new URLSearchParams(location.search); if(q.has('lang')){ lang=+q.get('lang'); document.getElementById('lang').value=lang; }
  if(q.has('zoom')) zoom=+q.get('zoom');
  if(q.has('only')){      // for screenshots: just these screens (?only=a,b&all=1 for every language)
    side.style.display='none';
    const ids=q.get('only').split(',');
    let h='<div class="grid" style="padding:16px">';
    ids.forEach(id=>{ const sc=SCREENS.find(x=>x.id===id); if(!sc) return;
      if(q.has('all')){ const saved=lang; for(let i=0;i<LANGS.length;i++){ lang=i; h+=`<div class="item"><div class="cap">${LANG_NAMES[i]}</div>`+`<div class="zoomwrap" style="width:${272*zoom}px;height:${480*zoom}px"><div style="transform:scale(${zoom});transform-origin:0 0;width:272px;height:480px;position:relative">${sc.build()}</div></div></div>`; } lang=saved; }
      else h+=cardHTML(sc,zoom); });
    document.getElementById('main').innerHTML=h+'</div>'; document.getElementById('main').style.padding='0';
    document.body.classList.toggle('showgrid', q.has('grid')); document.body.classList.toggle('show-names', q.has('names'));
    return;
  }
  render();
}

init();
</script></body></html>
